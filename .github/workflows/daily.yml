name: Cultura del giorno

on:
  schedule:
    # PiÃ¹ orari UTC per coprire ora legale/solare e i ritardi o le esecuzioni
    # saltate di GitHub. Lo script invia una sola volta al giorno, solo se a
    # Milano sono tra le 7 e le 11. Minuto :17 per evitare l'inizio ora.
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 7 * * *" # riserva
  workflow_dispatch: # esecuzione manuale per i test (ignora il controllo dell'ora)

permissions:
  contents: write # serve per salvare history.json e l'archivio

concurrency:
  group: cultura-del-giorno
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Genera e invia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python culture_agent.py

      - name: Salva lo storico
        run: |
          git config user.name "culture-bot"
          git config user.email "culture-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Aggiorna storico" && git pull --rebase && git push)

      # Il sito principale su Cloudflare Pages si costruisce da astro-public-site:
      # lo si allinea a main perché la nuova edizione vada online.
      - name: Aggiorna il ramo del sito
        run: git push origin HEAD:astro-public-site || echo "::warning::astro-public-site non è allineabile a main"
